<div class="mt">${M('Rischio',q.r,'#c8372d')}${M('Bottino possibile',q.l,'#d4a84b')}${M('Difficoltà',q.d,'#8aa0b8')}<div class="m"><small>Stima all’ora</small>${e?`<b class="${cl(e.pph)}">${fm(e.pph)}/ora</b><small>da ${e.k} tue run</small>`:`<span class="mu" style="font-size:12px">Nessun dato: registra run con “${q.m}”</span>`}</div></div>

function run(){const r=edit!==null?D.runs.find(x=>x.id===edit)||{}:{};const inp=f=>{const[k,l,t]=f,v=r[k]!==undefined?r[k]:(k==='date'?new Date().toISOString().slice(0,10):'');
let h=t==='sel'?`<select id="f_${k}">${MET.map(m=>`<option ${m===v?'selected':''}>${m}</option>`).join('')}</select>`:t==='mode'?`<select id="f_${k}">${['Solo','Gruppo'].map(m=>`<option ${m===v?'selected':''}>${m}</option>`).join('')}</select>`:`<input id="f_${k}" type="${t==='n'?'number':t}" ${t==='n'?'step="any" min="0"':''} value="${esc(v)}">`;return`<div><label>${l}</label>${h}</div>`};

(D.runs.length?`<div style="overflow:auto"><table><tr><th>Data</th><th>Metodo</th><th>Durata</th><th>Netto</th><th>€/ora</th><th>ROI</th><th></th></tr>${a.map(x=>`<tr><td>${x.r.date||'-'}</td><td>${esc(x.r.method)}</td><td>${x.c.d}′</td><td class="${cl(x.c.net)}">${fm(x.c.net)}</td><td>${x.c.pph===null?'-':fm(x.c.pph)}</td><td>${x.c.roi===null?'-':x.c.roi.toFixed(0)+'%'}</td><td><button class="b s" onclick="edit=${x.r.id};draw()">Modifica</button> <button class="b s" onclick="del(${x.r.id})">Elimina</button></td></tr>`).join('')}</table></div>`:'<div class="em">Nessuna run registrata. Compila il modulo qui sopra.</div>')}
function addRun(){const r={id:edit!==null?edit:Date.now(),u:Date.now()};F.forEach(f=>r[f[0]]=$('f_'+f[0]).value);if(!r.date){alert('Inserisci la data.');return}

function an(){const a=rs(),s=stats(a);return`<h2>Analisi</h2><div class="f p"><div><label>Metodo</label><select onchange="fl.m=this.value;draw()"><option value="">Tutti</option>${MET.map(m=>`<option ${fl.m===m?'selected':''}>${m}</option>`).join('')}</select></div><div><label>Periodo</label><select onchange="fl.r=this.value;draw()">${[['all','Sempre'],['7','Ultimi 7 giorni'],['30','Ultimi 30 giorni']].map(o=>`<option value="${o[0]}" ${fl.r===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div></div>
<div class="g">${K('Profitto totale',fm(s.t))}${K('Media per run',fm(s.avg))}${K('Mediana',fm(s.med))}${K('Miglior run',fm(s.best))}${K('Peggior run',fm(s.worst))}${K('Ore totali',s.h.toFixed(1))}${K('€/ora medio',fm(s.pph))}${K('Run in positivo',s.ok.toFixed(0)+'%')}</div>
<div class="p"><h3>Profitto netto per run</h3>${bars(a.map(x=>x.c.net),a.map(lab))}</div><div class="p"><h3>Profitto cumulativo</h3>${line(cum(a),a.map(lab))}</div><div class="p"><h3>Profitto all’ora</h3>${bars(a.map(x=>x.c.pph||0),a.map(lab))}</div><div class="p"><h3>Confronto per metodo</h3>${(()=>{const bm={};a.forEach(x=>bm[x.r.method]=(bm[x.r.method]||0)+x.c.net);const e=Object.entries(bm);return bars(e.map(y=>y[1]),e.map(y=>y[0]))})()}</div><div class="row"><button class="b s" onclick="csv()">Esporta run in CSV</button></div>`}
function obj(){const s=stats(rs());return`<h2>Obiettivi</h2><div class="p"><div class="f"><div><label>Obiettivo</label><input id="g_n"></div><div><label>Importo da raggiungere</label><input id="g_t" type="number" min="0"></div><div><label>Già messo da parte</label><input id="g_s" type="number" min="0"></div></div><div class="row"><button class="b" onclick="addG()">Aggiungi obiettivo</button></div></div>`+
(D.goals.length?D.goals.map((g,i)=>{const p=Math.min(100,N(g.t)?N(g.s)/N(g.t)*100:0),left=Math.max(0,N(g.t)-N(g.s));return`<div class="p"><b>${esc(g.n)}</b> <span class="mu">${fm(N(g.s))} / ${fm(N(g.t))}</span><div style="background:#0f0f0f;height:8px;border-radius:4px;margin:8px 0"><div style="width:${p}%;height:8px;background:var(--au);border-radius:4px"></div></div><span class="mu">${left===0?'Raggiunto':s.avg>0?'Servono circa '+Math.ceil(left/s.avg)+' run con la tua media di '+fm(s.avg):'Registra run in profitto per stimare il tempo'}</span> <button class="b s" onclick="delG(${i})">Elimina</button></div>`}).join(''):'<div class="em">Nessun obiettivo. Aggiungi il primo, per esempio un veicolo o un terreno.</div>')+
`${syncUI()}<h3>Backup</h3><div class="row"><button class="b s" onclick="exp()">Esporta tutto (JSON)</button><label class="b s" style="display:inline-block;color:var(--tx);cursor:pointer">Importa JSON<input type="file" accept=".json" hidden onchange="imp(this)"></label></div><p class="mu">I dati restano nel browser di questo PC. Esporta un backup ogni tanto.</p>`}
function addG(){const n=$('g_n').value.trim();if(!n){alert('Dai un nome all’obiettivo.');return}D.goals.push({id:Date.now(),u:Date.now(),n,t:$('g_t').value,s:$('g_s').value});save();draw()}
function dl(name,txt,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=name;a.click()}

function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.runs)throw 0;if(confirm('Sostituire i dati attuali con il backup?')){D=norm({runs:x.runs,goals:x.goals,sn:x.sn,del:x.del});save();draw()}}catch(e){alert('File non valido: scegli un backup JSON esportato da questa app.')}};r.readAsText(f)}
/* ---- Profilo e sincronizzazione (Supabase, senza librerie) ---- */
const SB_URL='',SB_KEY=''; // opzionale: incolla qui indirizzo e chiave pubblica per non digitarli su ogni dispositivo
let SB=(()=>{try{return JSON.parse(localStorage.getItem('rrmm_sb'))||{}}catch(e){return{}}})(),SY=SB.session?'Profilo collegato':'Salvato in locale',st=null,busy=false;
const sbc=()=>({u:(SB_URL||SB.url||'').replace(/\/+$/,''),k:SB_KEY||SB.key||''});
function sbSave(){try{localStorage.setItem('rrmm_sb',JSON.stringify(SB))}catch(e){}}
function setSY(t){SY=t;const e=$('sy');if(e)e.textContent=t}
async function api(path,o,auth){o=o||{};const c=sbc(),h=Object.assign({apikey:c.k,'Content-Type':'application/json'},o.headers||{});if(auth)h.Authorization='Bearer '+await tok();
const r=await fetch(c.u+path,Object.assign({},o,{headers:h}));let j=null;try{j=await r.json()}catch(e){}return{ok:r.ok,s:r.status,j}}
function setS(j){SB.session={at:j.access_token,rt:j.refresh_token,exp:Math.floor(Date.now()/1000)+(j.expires_in||3600),id:j.user.id,email:j.user.email};sbSave()}
async function tok(){const s=SB.session;if(!s)throw new Error('no');if(s.exp-Date.now()/1000<60){const r=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.rt})});if(!r.ok||!r.j||!r.j.access_token){SB.session=null;sbSave();throw new Error('auth')}setS(r.j)}return SB.session.at}
function mergeD(a,b){a=norm(a);b=norm(b);const del=Object.assign({},a.del);for(const k in b.del)del[k]=Math.max(del[k]||0,b.del[k]);
const un=(p,l,r)=>{const m={};l.concat(r).forEach(o=>{const c=m[o.id];if(!c||(o.u||0)>(c.u||0))m[o.id]=o});return Object.values(m).filter(o=>!(del[p+o.id]!==undefined&&del[p+o.id]>=(o.u||0)))};
const sn={};new Set(Object.keys(a.sn).concat(Object.keys(b.sn))).forEach(k=>{const x=a.sn[k],y=b.sn[k];sn[k]=!y||(x&&(x.u||0)>=(y.u||0))?x:y});
const x=a.timer,y=b.timer;return{runs:un('r',a.runs,b.runs),goals:un('g',a.goals,b.goals),sn,del,timer:(!y||(x&&(x.u||0)>=(y.u||0)))?(x||null):y}}
async function syncNow(){if(!SB.session||busy)return;if(!navigator.onLine){setSY('Offline: sincronizzo appena possibile');return}
busy=true;setSY('Sincronizzazione in corso');
try{for(let i=0;i<4;i++){const uid=SB.session.id,g=await api('/rest/v1/app_data?user_id=eq.'+uid+'&select=data,rev',{},true);if(!g.ok||!Array.isArray(g.j))throw new Error('get');
const row=g.j[0],before=JSON.stringify(D);if(row)D=mergeD(D,row.data||{});const changed=JSON.stringify(D)!==before;save(true);
const p=row?await api('/rest/v1/app_data?user_id=eq.'+uid+'&rev=eq.'+row.rev,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({data:D})},true)
:await api('/rest/v1/app_data',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:uid,data:D})},true);
if(p.ok&&Array.isArray(p.j)&&p.j.length){SB.last=Date.now();sbSave();setSY('Sincronizzato');if((changed&&tab!=='run')||tab==='obj')draw();return}
if(!p.ok&&p.s!==409)throw new Error('put')}
setSY('Conflitto: riprova tra poco')}catch(e){setSY(e.message==='auth'||e.message==='no'?'Accedi di nuovo per sincronizzare':'Errore di sincronizzazione')}finally{busy=false}}

async function auth(m){const msg=$('smsg');if(!SB_URL){SB.url=$('s_url').value.trim();SB.key=$('s_key').value.trim()}const em=$('s_em').value.trim(),pw=$('s_pw').value,c=sbc();
if(!/^https:\/\//.test(c.u)||!c.k||!em||pw.length<6){msg.textContent='Compila indirizzo (https://…), chiave, email e una password di almeno 6 caratteri.';return}
sbSave();msg.textContent='Attendi…';
try{const r=await api(m==='up'?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:em,password:pw})});

if(n>=t.end){if(P.nid!==t.id){P.nid=t.id;saveP();notify('Erba pronta per la raccolta!');if(tab==='prod')draw()}return}

return`<h2>Produzione</h2><div class="pg"><div class="p pc"><svg viewBox="0 0 220 220" style="max-width:240px;margin:0 auto" role="img" aria-label="Avanzamento della crescita"><circle cx="110" cy="110" r="90" fill="none" stroke="#2a2626" stroke-width="12"/><circle id="pr" cx="110" cy="110" r="90" fill="none" stroke="${rd?'#6fae7a':'#d4a84b'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${TC}" style="stroke-dashoffset:${TC*(1-fr)};transform:rotate(-90deg);transform-origin:110px 110px"/><text id="pt" x="110" y="116" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="${rd?32:38}" fill="${rd?'#6fae7a':'#e9e4dc'}">${!on?'--:--':rd?'Pronta':hms(t.end-n)}</text><text x="110" y="142" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#9a938a">${!on?'Nessun timer attivo':rd?'Pronta per la raccolta':'Erba in crescita'}</text></svg><p class="mu" style="margin:6px 0 14px">${on?(rd?'Pronta dalle ':'Pronta alle ')+hr(t.end):'Imposta i potenziamenti e avvia il timer'}</p>${rd?`<button class="b big" onclick="tgo()">Raccolta fatta, riavvia</button><button class="b s big" style="margin-top:8px" onclick="tstop()">Ferma</button>`:on?`<button class="b s big" onclick="tstop()">Ferma timer</button>`:`<button class="b big" onclick="tgo()">Avvia timer</button>`}</div>
<div class="p"><h3 style="margin-top:0">Grow Table: erba</h3><div class="mu" style="font-size:12px">Durata base</div><div style="font:700 22px Georgia,serif">1 ora</div><h3>Potenziamenti montati</h3>${PU.map(x=>`<button class="ck ${u[x[0]]?'on':''}" aria-pressed="${!!u[x[0]]}" onclick="pup('${x[0]}',${!u[x[0]]})"><span style="flex:1;text-align:left">${x[1]}</span><b>−${x[2]}%</b></button>`).join('')}<p id="pv" class="mu" style="margin:12px 0 0">${pvt()}</p></div></div>
<div class="row" style="margin:14px 0 6px"><button class="b s" onclick="askN()" ${np==='granted'||np==='no'?'disabled':''}>${np==='granted'?'Avvisi attivi':np==='denied'?'Avvisi bloccati dal browser':'Attiva avvisi'}</button></div><p class="nt">Il timer resta salvato anche se chiudi l’app e, con il profilo collegato, compare sugli altri dispositivi. Suono e avviso partono solo con l’app aperta. I potenziamenti scelti non cambiano un timer già avviato.</p>`}
