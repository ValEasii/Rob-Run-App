function delG(i){const g=D.goals[i];D.del['g'+g.id]=Date.now();D.goals.splice(i,1);save();draw()}
function syncUI(){const c=sbc();return`<h3>Profilo e sincronizzazione</h3><div class="p">`+(SB.session?`<p style="margin-top:0">Collegato come <b>${esc(SB.session.email)}</b><br><span class="mu">Ultima sincronizzazione: ${SB.last?new Date(SB.last).toLocaleString('it-IT'):'mai'}</span></p><div class="row"><button class="b" onclick="syncNow()">Sincronizza ora</button><button class="b s" onclick="logout()">Esci</button></div>`:`<p class="mu" style="margin-top:0">L’app funziona anche senza profilo. Collegane uno per sincronizzare run, obiettivi e note tra i tuoi dispositivi.</p><div class="f">${SB_URL?'':`<div><label>Indirizzo del progetto</label><input id="s_url" value="${esc(c.u)}" placeholder="https://xxxx.supabase.co"></div><div><label>Chiave pubblica</label><input id="s_key" value="${esc(c.k)}"></div>`}<div><label>Email</label><input id="s_em" type="email" autocomplete="username"></div><div><label>Password</label><input id="s_pw" type="password" autocomplete="current-password"></div></div><div class="row"><button class="b" onclick="auth('in')">Accedi</button><button class="b s" onclick="auth('up')">Crea profilo</button></div>`)+`<p id="smsg" class="mu" role="status"></p></div>`}
addEventListener('online',()=>{if(SB.session)syncNow()});
/* ---- Produzione: timer di raccolta (erba e laboratorio) ---- */
const PK='rrmm_prod',TC=565.49,PU=[['uv','Lampada UV',24],['fan','Ventilatore',12],['pump','Pompa dell’acqua',14]],RX={1:[4,900],2:[6,530],3:[8,337]},LU=[['ev','Improved Evaporator',11.7],['qr','Quality Refrigerant',13]],CAP={2:6,3:8},RM=['I','II','III'];
let P=(()=>{try{const x=JSON.parse(localStorage.getItem(PK));if(x&&x.cfg)return x}catch(e){}return{cfg:{weed:{}}}})();
P.cfg=P.cfg||{};P.cfg.weed=P.cfg.weed||{};P.cfg.lab=P.cfg.lab||{};P.cfg.lab.rx=P.cfg.lab.rx||1;P.cfg.lab.fz=P.cfg.lab.fz||1;P.cfg.lab.up=P.cfg.lab.up||{};P.nids=P.nids||{};P.sec=P.sec||'weed';
function saveP(){try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){}}
const BASE=60,pr=()=>{const u=P.cfg.weed.up||{};return Math.min(95,PU.filter(x=>u[x[0]]).reduce((a,x)=>a+x[2],0))},pm=()=>BASE*60000*(1-pr()/100);
const rxMs=()=>{const c=RX[P.cfg.lab.rx]||RX[1];return c[0]*c[1]*1000};
const fzR=()=>Math.min(95,LU.filter(x=>P.cfg.lab.up[x[0]]).reduce((a,x)=>a+x[2],0)),fzMs=()=>30*60000*(1-fzR()/100);
const hms=ms=>{ms=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return(h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
const pvt=()=>{const d=pm(),r=pr();return'Tempo effettivo: '+hms(d)+(r?' (riduzione '+r+'%)':'')};
const pc=v=>String(v).replace('.',',');
const TM={weed:{k:'timer',n:'Erba',col:'#d4a84b',st:'Erba in crescita',rd:'Pronta',rt:'Pronta per la raccolta',re:'Raccolta fatta, riavvia',msg:'Erba pronta per la raccolta!',d:pm},
reac:{k:'treac',n:'Reattore chimico',col:'#d4a84b',st:'Reattore in funzione',rd:'Pronto',rt:'Lotto pronto',re:'Riavvia reattore',msg:'Reattore: lotto pronto, sposta i vassoi nel congelatore',d:rxMs},
frz:{k:'tfrz',n:'Congelatore',col:'#8aa0b8',st:'Congelamento in corso',rd:'Pronto',rt:'Cristalli pronti',re:'Riavvia congelatore',msg:'Cristalli congelati: frantumali e vendili',d:fzMs}};
function psec(s){P.sec=s;saveP();draw()}
function pup(id,v){P.cfg.weed.up=P.cfg.weed.up||{};P.cfg.weed.up[id]=v;saveP();draw()}
function plv(k,v){P.cfg.lab[k]=v;saveP();draw()}
function pluq(id,v){P.cfg.lab.up[id]=v;saveP();draw()}
function tgo(id){const T=TM[id],d=T.d(),n=Date.now();D[T.k]={id:n,u:n,on:true,end:n+d,dur:d};save();draw()}
function tstop(id){const t=D[TM[id].k];if(t){t.on=false;t.u=Date.now();save();draw()}}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),350)}catch(e){}}
function notify(msg){try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}beep();
try{if('Notification' in window&&Notification.permission==='granted'){if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification('ROB RUN',{body:msg,icon:'icon-192.png'}));else new Notification('ROB RUN',{body:msg})}}catch(e){}}
function askN(){try{Notification.requestPermission().then(()=>draw())}catch(e){alert('Avvisi non supportati da questo browser.')}}
function ptick(){const n=Date.now();Object.keys(TM).forEach(id=>{const T=TM[id],t=D[T.k];if(!t||!t.on)return;
if(n>=t.end){if(P.nids[id]!==t.id){P.nids[id]=t.id;saveP();notify(T.msg);if(tab==='prod')draw()}return}
if(tab==='prod'){const e=$('pt_'+id),r=$('pr_'+id);if(e)e.textContent=hms(t.end-n);if(r)r.style.strokeDashoffset=TC*(1-Math.min(1,Math.max(0,1-(t.end-n)/t.dur)))}})}
setInterval(ptick,1000);
addEventListener('visibilitychange',()=>{try{if(!document.hidden)ptick()}catch(e){}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function ringCard(id){const T=TM[id],t=D[T.k],n=Date.now(),on=!!(t&&t.on),rd=on&&n>=t.end,fr=on?Math.min(1,Math.max(0,1-(t.end-n)/t.dur)):0,hr=x=>new Date(x).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),col=rd?'#6fae7a':T.col;
const btns=rd?`${id==='reac'?'<button class="b big" onclick="tgo(\'frz\')">Avvia congelatore</button>':''}<button class="b${id==='reac'?' s':''} big" style="margin-top:8px" onclick="tgo('${id}')">${T.re}</button><button class="b s big" style="margin-top:8px" onclick="tstop('${id}')">Ferma</button>`:on?`<button class="b s big" onclick="tstop('${id}')">Ferma timer</button>`:`<button class="b big" onclick="tgo('${id}')">Avvia timer</button>`;
return`<div class="p pc"><h3 style="margin-top:0">${T.n}</h3><svg viewBox="0 0 220 220" style="max-width:220px;margin:0 auto" role="img" aria-label="Avanzamento: ${T.n}"><circle cx="110" cy="110" r="90" fill="none" stroke="#2a2626" stroke-width="12"/><circle id="pr_${id}" cx="110" cy="110" r="90" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${TC}" style="stroke-dashoffset:${TC*(1-fr)};transform:rotate(-90deg);transform-origin:110px 110px"/><text id="pt_${id}" x="110" y="116" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="${rd?32:38}" fill="${rd?'#6fae7a':'#e9e4dc'}">${!on?'--:--':rd?T.rd:hms(t.end-n)}</text><text x="110" y="142" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#9a938a">${!on?'Nessun timer attivo':rd?T.rt:T.st}</text></svg><p class="mu" style="margin:6px 0 14px">${on?(rd?'Pronto dalle ':'Pronto alle ')+hr(t.end):'Durata: '+hms(T.d())}</p>${btns}</div>`}
function prod(){const np='Notification' in window?Notification.permission:'no',sec=P.sec==='lab'?'lab':'weed',L=P.cfg.lab,c=P.cfg.weed,u=c.up||{},rx=RX[L.rx]||RX[1],cap=CAP[L.fz],fr=fzR();
const sw=`<div class="sg" style="max-width:340px;margin:0 auto 18px">${[['weed','Erba'],['lab','Laboratorio']].map(x=>`<button class="${sec===x[0]?'on':''}" aria-pressed="${sec===x[0]}" onclick="psec('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
const lvl=(k,sel)=>`<div class="sg">${[1,2,3].map(v=>`<button class="${sel==v?'on':''}" aria-pressed="${sel==v}" onclick="plv('${k}',${v})">${RM[v-1]}</button>`).join('')}</div>`;
const body=sec==='weed'?`<div class="pg">${ringCard('weed')}<div class="p"><h3 style="margin-top:0">Grow Table: erba</h3><div class="mu" style="font-size:12px">Durata base</div><div style="font:700 22px Georgia,serif">1 ora</div><h3>Potenziamenti montati</h3>${PU.map(x=>`<button class="ck ${u[x[0]]?'on':''}" aria-pressed="${!!u[x[0]]}" onclick="pup('${x[0]}',${!u[x[0]]})"><span style="flex:1;text-align:left">${x[1]}</span><b>−${x[2]}%</b></button>`).join('')}<p id="pv" class="mu" style="margin:12px 0 0">${pvt()}</p></div></div>`
:`<p class="mu" style="text-align:center;margin-top:0">Reagenti, poi reattore, poi congelatore, poi tavolo da laboratorio. Totale indicativo: <b style="color:var(--tx)">${hms(rxMs())}</b> + <b style="color:var(--tx)">${hms(fzMs())}</b> = <b style="color:var(--au)">${hms(rxMs()+fzMs())}</b></p><div class="pg">${ringCard('reac')}${ringCard('frz')}<div class="p"><h3 style="margin-top:0">Reattore chimico</h3>${lvl('rx',L.rx)}<p class="mu" style="margin:8px 0 0;font-size:13px">${rx[0]} cicli da ${rx[1]} s: ${hms(rxMs())} in totale, ${rx[0]} vassoi</p><h3>Congelatore industriale</h3>${lvl('fz',L.fz)}<p class="mu" style="margin:8px 0 10px;font-size:13px">${cap?'Capacità: '+cap+' slot':'Capacità base'}</p>${LU.map(x=>`<button class="ck ${L.up[x[0]]?'on':''}" aria-pressed="${!!L.up[x[0]]}" onclick="pluq('${x[0]}',${!L.up[x[0]]})"><span style="flex:1;text-align:left">${x[1]}</span><b>−${pc(x[2])}%</b></button>`).join('')}<p class="mu" style="margin:12px 0 0">Congelamento: ${hms(fzMs())}${fr?' (riduzione '+pc(Math.round(fr*10)/10)+'%)':''}</p>${cap&&rx[0]>cap?'<p class="nt" style="margin-top:8px">Il reattore produce più vassoi di quanti ne entrano nel congelatore.</p>':''}</div></div>`;
return`<h2>Produzione</h2>${sw}${body}<div class="row" style="margin:14px 0 6px"><button class="b s" onclick="askN()" ${np==='granted'||np==='no'?'disabled':''}>${np==='granted'?'Avvisi attivi':np==='denied'?'Avvisi bloccati dal browser':'Attiva avvisi'}</button></div><p class="nt">I timer restano salvati anche se chiudi l’app e, con il profilo collegato, compaiono sugli altri dispositivi. Suono e avviso partono solo con l’app aperta. Le impostazioni scelte non cambiano un timer già avviato. I dati del laboratorio vengono da te e da video di terzi: verificali in partita.</p>`}

draw();
if(SB.session)syncNow();
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
